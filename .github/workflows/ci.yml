# Runs on every push. Three groups of tests must pass; only then, and only on
# the main branch, is the site published to GitHub Pages.
# (Render publishes the backend by itself once these checks have passed.)
name: Test and publish

on:
  push:
  pull_request:

# By default a job may only read the code.
permissions:
  contents: read

# Optional: names the site must not mention, stored as a repository secret
# (Settings > Secrets and variables > Actions). Without it, that one check is skipped.
env:
  BANNED_NAMES: ${{ secrets.BANNED_NAMES }}

# Actions are pinned to an exact commit, so a changed tag cannot swap in other code.
jobs:
  frontend:
    name: Site (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Runs the tests, checks the types, then builds.
      - run: npm run build
      - name: The built site must not contain a local address
        run: |
          if grep -rIlE 'localhost|127\.0\.0\.1' dist; then
            echo "::error::A local address was found in the built site (see the files above)."
            exit 1
          fi
      - name: Keep the built site for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  backend:
    name: Backend (tests, index is current)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: The chatbot's index must match the content
        run: |
          python -m ingest.build_index
          if ! git diff --exit-code -- data/index.json; then
            echo "::error::content/ or the CV changed but backend/data/index.json was not rebuilt. Run 'python -m ingest.build_index' in backend/ and commit the result."
            exit 1
          fi

  e2e:
    name: Whole site in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - name: Keep the report when a test failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  publish:
    name: Publish the site
    # Only for a push to main, and only when everything above passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never two publications at once; a running one is allowed to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
